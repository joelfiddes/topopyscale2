name: Wheels

# Prebuilt wheels so users can `pip install` TPS2 without a Rust toolchain.
# Runs only on release tags and on demand: on a private repo macOS minutes bill at
# 10x, and on the public repo Actions is free. Wheels are uploaded as workflow
# artifacts; publishing them (release assets or PyPI) is a separate, deliberate step.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  wheels:
    name: wheels (${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: x86_64}
          - {os: ubuntu-24.04-arm, target: aarch64}
          - {os: macos-15-intel, target: x86_64}
          - {os: macos-15, target: aarch64}
          - {os: windows-latest, target: x64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.11
            3.12
            3.13
      - name: Build wheels (one per Python version; the extension is not abi3)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist --interpreter 3.11 3.12 3.13
      - name: Check the wheel carries the Rust kernels
        shell: bash
        run: |
          python -m pip install --find-links dist --only-binary topopyscale2 topopyscale2
          # Import from outside the checkout: inside it, ./topopyscale2 (the source, with no
          # compiled kernels) shadows the installed wheel.
          cd "$RUNNER_TEMP"
          python -c "import topopyscale2.core._rust_kernels; from topopyscale2.core.dispatch import available_backends; b = available_backends(); print(b); assert 'rust' in b"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
