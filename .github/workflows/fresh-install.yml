name: Fresh install

# What a first-time user does, on each operating system: a clean virtualenv with only the
# declared dependencies, `pip install .` (builds the Rust kernels), every command's --help,
# `tps2 init`, the demo rebuilt byte for byte, the test suite against the installed package,
# and a real ERA5 run of examples/points with the default backend.
# Runs on demand and on release tags; Actions is free on this public repository.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  fresh-install:
    name: fresh install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Clean install check (incl. a real ERA5 point run)
        shell: bash
        env:
          TPS2_CHECK_ONLINE: "1"
          NO_COLOR: "1"
          PYTHONUTF8: "0"   # Windows: test with the locale encoding a user's machine has
        run: bash scripts/release/clean_install_check.sh . python
